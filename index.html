<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EBF Ops">
<meta name="theme-color" content="#ea580c">
<title>EBF Operaciones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --fire:#ea580c;--fire-d:#c2410c;--green:#16a34a;--green-d:#15803d;
  --blue:#2563eb;--navy:#1e293b;--smoke:#0f172a;
  --fog:#e2e8f0;--mist:#f8fafc;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body,#app{height:100%;margin:0;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;color:var(--navy);background:var(--mist)}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}
/* header */
.hdr{background:linear-gradient(135deg,var(--fire),var(--fire-d));color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(234,88,12,.4)}
.hdr h1{font-size:1rem;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .sub{font-size:.65rem;opacity:.8;margin-top:1px}
.hdr-back{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:6px;
  padding:7px 10px;cursor:pointer;font-size:1rem;flex-shrink:0}
.hdr-actions{display:flex;gap:5px;flex-shrink:0}
.hdr-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:.75rem;font-weight:700;white-space:nowrap}
.hdr-btn.wa{background:rgba(37,211,102,.35)}
/* scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;
  display:flex;flex-direction:column;gap:9px}
/* cards */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}
.card-hdr{padding:7px 12px;font-size:.8rem;font-weight:800;color:#fff}
.card-hdr.fire{background:linear-gradient(135deg,#16a34a,#15803d)}
.card-hdr.blue{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.card-hdr.map{background:linear-gradient(135deg,#7c3aed,#5b21b6)}
.card-hdr.navy{background:linear-gradient(135deg,#334155,var(--navy))}
.card-hdr.amber{background:linear-gradient(135deg,#d97706,#b45309)}
.card-hdr.teal{background:linear-gradient(135deg,#0891b2,#0e7490)}
.card-hdr.purple{background:linear-gradient(135deg,#7c3aed,#6d28d9)}
.card-body{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
/* checkboxes */
.cb-wrap{display:flex;flex-wrap:wrap;gap:5px}
.cb{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:6px;
  border:1.5px solid var(--fog);background:#fff;cursor:pointer;
  font-size:.8rem;color:#475569;transition:all .1s;user-select:none;-webkit-user-select:none}
.cb.on{border-color:var(--c,var(--fire));background:color-mix(in srgb,var(--c,var(--fire)) 10%,white);
  color:var(--c,var(--fire));font-weight:700}
/* inputs */
.lbl{font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px}
input,select,textarea{width:100%;padding:9px 10px;border:1.5px solid var(--fog);border-radius:6px;
  font-size:.88rem;background:#fff;color:var(--navy);font-family:inherit;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fire)}
textarea{resize:vertical;min-height:58px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.fld{display:flex;flex-direction:column;gap:2px}
/* steps */
.steps{background:#fff;padding:8px 10px;display:flex;gap:5px;overflow-x:auto;
  flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.08);-webkit-overflow-scrolling:touch}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:18px;
  border:2px solid var(--fog);font-size:.75rem;cursor:pointer;white-space:nowrap;
  flex-shrink:0;color:#94a3b8;transition:all .15s}
.step.active{border-color:var(--fire);background:var(--fire);color:#fff;font-weight:700}
.step.done{border-color:var(--green);background:#f0fdf4;color:var(--green);font-weight:700}
/* nav */
.nav{display:flex;justify-content:space-between;padding:8px 12px;background:#fff;
  flex-shrink:0;box-shadow:0 -1px 4px rgba(0,0,0,.08)}
.btn{padding:9px 16px;border-radius:7px;border:none;cursor:pointer;font-weight:700;font-size:.85rem}
.btn-fire{background:var(--fire);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--fog)}
.btn-sm{padding:7px 12px;font-size:.8rem}
/* list */
.op-item{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);
  padding:11px 14px;display:flex;align-items:center;gap:9px;border-left:4px solid var(--fire)}
.op-item.cerrada{border-left-color:var(--green)}
.op-name{font-weight:700;font-size:.95rem}
.op-meta{font-size:.72rem;color:#94a3b8;margin-top:2px}
/* bitacora */
.bita-list{max-height:170px;overflow-y:auto;border:1.5px solid var(--fog);
  border-radius:6px;background:var(--mist);-webkit-overflow-scrolling:touch}
.bita-row{display:flex;gap:7px;padding:6px 9px;border-bottom:1px solid var(--fog);align-items:flex-start}
.bita-hora{font-size:.72rem;font-weight:700;color:var(--blue);flex-shrink:0;font-family:monospace;padding-top:1px}
.bita-txt{font-size:.83rem;flex:1;line-height:1.4}
.bita-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1.1rem;padding:0;flex-shrink:0}
.hora-badge{font-size:.78rem;font-weight:700;color:var(--blue);padding:8px 9px;
  background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:6px;font-family:monospace;flex-shrink:0}
/* croquis */
#croquis-svg{width:100%;border-radius:6px;border:2px solid #cbd5e1;background:white;
  display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.rec-chip{padding:3px 9px;border-radius:11px;font-size:.75rem;font-weight:600;
  display:inline-flex;align-items:center;gap:4px;border:1.5px solid;margin:2px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 28px;
  width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal-title{font-size:1rem;font-weight:800;margin-bottom:10px}
/* empty */
.empty{text-align:center;padding:50px 20px;color:#94a3b8}
/* toast */
.toast{position:fixed;bottom:calc(70px + var(--safe-bot));left:50%;
  transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:9px 18px;border-radius:18px;font-size:.83rem;font-weight:600;
  z-index:300;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);
  animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:12px;color:#94a3b8;font-size:.9rem}
.spin{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:var(--fire);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

// ── ALMACENAMIENTO LOCAL (localStorage del celular) ───────────────────────
const LS_KEY='ebf_ops_pwa_v1';
function lsRead(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch(e){return[]}}
function lsWrite(list){try{localStorage.setItem(LS_KEY,JSON.stringify(list));return true}catch(e){return false}}
async function dbLoadOps(){
  return lsRead().sort((a,b)=>String(b.creada||'').localeCompare(String(a.creada||'')));
}
async function dbSaveOp(op){
  const list=lsRead();
  const i=list.findIndex(o=>o.id===op.id);
  if(i>=0)list[i]=op;else list.unshift(op);
  lsWrite(list);
}
async function dbDelOp(id){
  lsWrite(lsRead().filter(o=>o.id!==id));
}
function exportarRespaldo(){
  const blob=new Blob([JSON.stringify(lsRead(),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='respaldo-ebf-operaciones-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function importarRespaldo(file,done){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const inc=JSON.parse(r.result);
      if(!Array.isArray(inc))throw new Error('formato');
      const cur=lsRead();const ids=new Set(cur.map(o=>o.id));
      const merged=[...cur,...inc.filter(o=>o&&o.id&&!ids.has(o.id))];
      lsWrite(merged);done(merged.length-cur.length);
    }catch(e){done(-1)}
  };
  r.readAsText(file);
}

function BitacoraInput({onAdd}){
  const[v,setV]=useState('');
  const add=()=>{if(v.trim()){onAdd(v.trim());setV('')}};
  return<div style={{display:'flex',gap:5}}>
    <span className="hora-badge">{new Date().toTimeString().slice(0,5)}</span>
    <input value={v} onChange={e=>setV(e.target.value)} placeholder="Nueva entrada…"
      style={{flex:1}} onKeyDown={e=>e.key==='Enter'&&add()}/>

}

function Croquis({recursos,onChange}){
  const[drag,setDrag]=useState(null);
  const[off,setOff]=useState({x:0,y:0});
  const[editId,setEditId]=useState(null);
  const[editVal,setEditVal]=useState('');
  const[newR,setNewR]=useState({tipo:RECURSOS_TIPOS[0],label:''});
  const svgRef=useRef();
  const W=360,H=460,ML=28,MR=28,MT=26,MB=26;
  const GX1=ML,GX2=W-MR,GY1=MT,GY2=H-MB,GW=GX2-GX1,GH=GY2-GY1,CX=GX1+GW/2;
  const r1=GY1+GH*.37,r2=GY1+GH*.65;
  const gc=e=>{const r=svgRef.current.getBoundingClientRect();const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;return{x:Math.round((cx-r.left)*(W/r.width)),y:Math.round((cy-r.top)*(H/r.height))};};
  const dn=(e,id)=>{e.preventDefault();const c=gc(e);const r=recursos.find(x=>x.id===id);if(!r)return;setDrag(id);setOff({x:c.x-r.x,y:c.y-r.y});};
  const mv=useCallback(e=>{if(!drag)return;e.preventDefault();const c=gc(e);onChange(recursos.map(r=>r.id===drag?{...r,x:Math.max(16,Math.min(W-16,c.x-off.x)),y:Math.max(16,Math.min(H-16,c.y-off.y))}:r));},[drag,off,recursos]);
  const up=useCallback(()=>setDrag(null),[]);
  const add=()=>{if(!newR.label.trim())return;onChange([...recursos,{id:Date.now(),icon:newR.tipo.icon,label:newR.label,tipo:newR.tipo.label,shape:newR.tipo.shape,color:newR.tipo.color,x:W/2+Math.random()*40-20,y:H/2+Math.random()*40-20}]);setNewR(p=>({...p,label:''}));};
  const del=id=>onChange(recursos.filter(r=>r.id!==id));
  const saveEdit=()=>{onChange(recursos.map(r=>r.id===editId?{...r,label:editVal}:r));setEditId(null);};
  const Xbtn=({cx,cy,id})=><g><circle cx={cx} cy={cy} r={8} fill="#dc2626" onClick={e=>{e.stopPropagation();del(id)}} style={{cursor:'pointer'}}/><text x={cx} y={cy+3} textAnchor="middle" fontSize="10" fill="white" onClick={e=>{e.stopPropagation();del(id)}} style={{cursor:'pointer'}}>×</text></g>;
  const Ebtn=({cx,cy,r})=><g><circle cx={cx} cy={cy} r={8} fill="#2563eb" onClick={e=>{e.stopPropagation();setEditId(r.id);setEditVal(r.label);}} style={{cursor:'pointer'}}/><text x={cx} y={cy+3} textAnchor="middle" fontSize="9" fill="white" onClick={e=>{e.stopPropagation();setEditId(r.id);setEditVal(r.label);}} style={{cursor:'pointer'}}>✎</text></g>;
  const rr=r=>{const lbl=r.label||'';const h={onMouseDown:e=>dn(e,r.id),onTouchStart:e=>dn(e,r.id),style:{cursor:drag===r.id?'grabbing':'grab'}};
    if(r.shape==='pc')return<g key={r.id} transform={`translate(${r.x},${r.y})`} {...h}><rect x={-24} y={-14} width={48} height={28} rx={4} fill="#f97316" stroke="#c2410c" strokeWidth={2}/><text textAnchor="middle" dominantBaseline="central" fontSize="12" fontWeight="900" fill="#000" fontFamily="Arial">PC</text><text y={25} textAnchor="middle" fontSize="8" fill="#333" fontFamily="Arial">{lbl}</text><Xbtn cx={20} cy={-15} id={r.id}/><Ebtn cx={-20} cy={-15} r={r}/></g>;
    if(r.shape==='are')return<g key={r.id} transform={`translate(${r.x},${r.y})`} {...h}><circle r={17} fill="#eab308" stroke="#a16207" strokeWidth={2}/><text textAnchor="middle" dominantBaseline="central" fontSize="13" fontWeight="900" fill="#000" fontFamily="Arial">E</text><text y={28} textAnchor="middle" fontSize="8" fill="#333" fontFamily="Arial">{lbl}</text><Xbtn cx={15} cy={-18} id={r.id}/><Ebtn cx={-15} cy={-18} r={r}/></g>;
    if(r.shape==='pap')return<g key={r.id} transform={`translate(${r.x},${r.y})`} {...h}><polygon points="0,-17 17,0 0,17 -17,0" fill="#0ea5e9" stroke="#0369a1" strokeWidth={2}/><text textAnchor="middle" dominantBaseline="central" fontSize="7" fontWeight="900" fill="#000" fontFamily="Arial">PAP</text><text y={28} textAnchor="middle" fontSize="8" fill="#333" fontFamily="Arial">{lbl}</text><Xbtn cx={15} cy={-18} id={r.id}/><Ebtn cx={-15} cy={-18} r={r}/></g>;
    return<g key={r.id} transform={`translate(${r.x},${r.y})`} {...h}><circle r={17} fill={r.color||'#374151'} stroke="white" strokeWidth={1.5} fillOpacity=".92"/><text textAnchor="middle" dominantBaseline="central" fontSize="13">{r.icon}</text><rect x={-26} y={19} width={52} height={14} rx={3} fill="#111" fillOpacity=".7"/><text y={29} textAnchor="middle" fontSize="8" fill="white" fontFamily="Arial" fontWeight="700">{lbl}</text><Xbtn cx={14} cy={-16} id={r.id}/><Ebtn cx={-14} cy={-16} r={r}/></g>;
  };
  return<div>
    {editId&&<div style={{display:'flex',gap:6,marginBottom:7,alignItems:'center',background:'#eff6ff',border:'1px solid #93c5fd',borderRadius:6,padding:'7px 10px'}}>
      <span style={{fontSize:12,fontWeight:600,color:'#1d4ed8'}}>✎</span>
      <input value={editVal} onChange={e=>setEditVal(e.target.value)} autoFocus style={{flex:1,fontSize:12,padding:'5px 8px',border:'1px solid #93c5fd',borderRadius:4}} onKeyDown={e=>e.key==='Enter'&&saveEdit()}/>
      <button onClick={saveEdit} style={{padding:'5px 10px',background:'#2563eb',color:'white',border:'none',borderRadius:4,cursor:'pointer',fontSize:12,fontWeight:700}}>✓</button>
      <button onClick={()=>setEditId(null)} style={{padding:'5px 8px',border:'1px solid #ddd',borderRadius:4,cursor:'pointer',fontSize:12}}>✕</button>
    </div>}
    <svg ref={svgRef} id="croquis-svg" viewBox={`0 0 ${W} ${H}`} onMouseMove={mv} onMouseUp={up} onMouseLeave={up} onTouchMove={mv} onTouchEnd={up}>
      <rect width={W} height={H} fill="white"/>
      <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse" x={GX1} y={GY1}><path d="M20 0L0 0 0 20" fill="none" stroke="#e2e8f0" strokeWidth=".8"/></pattern></defs>
      <rect x={GX1} y={GY1} width={GW} height={GH} fill="url(#g)"/>
      <rect x={GX1} y={GY1} width={GW} height={GH} fill="none" stroke="#334155" strokeWidth={2}/>
      <line x1={CX} y1={GY1} x2={CX} y2={GY2} stroke="#334155" strokeWidth={1.5}/>
      <line x1={GX1} y1={r1} x2={GX2} y2={r1} stroke="#334155" strokeWidth={1.5}/>
      <line x1={GX1} y1={r2} x2={GX2} y2={r2} stroke="#334155" strokeWidth={1.5}/>
      <image href={FIRE_IMG} x={GX1+GW*.1} y={GY1+GH*.02} width={GW*.8} height={GH*.95} opacity=".45" preserveAspectRatio="xMidYMid meet"/>
      <rect x={GX1+GW*.28} y={0} width={GW*.44} height={MT} fill="#cbd5e1"/>
      <text x={CX} y={MT-5} textAnchor="middle" fontSize="9" fontWeight="800" fill="#1e293b" fontFamily="Arial">Cabeza</text>
      <rect x={GX1+GW*.28} y={GY2} width={GW*.44} height={MB} fill="#cbd5e1"/>
      <text x={CX} y={GY2+17} textAnchor="middle" fontSize="9" fontWeight="800" fill="#1e293b" fontFamily="Arial">Cola</text>
      <rect x={0} y={GY1} width={ML} height={GH} fill="#dbeafe"/>
      <text x={ML-6} y={GY1+GH/2} textAnchor="middle" fontSize="8" fontWeight="700" fill="#1d4ed8" fontFamily="Arial" transform={`rotate(-90,${ML-6},${GY1+GH/2})`}>Flanco izquierdo</text>
      <rect x={GX2} y={GY1} width={MR} height={GH} fill="#dbeafe"/>
      <text x={GX2+6} y={GY1+GH/2} textAnchor="middle" fontSize="8" fontWeight="700" fill="#1d4ed8" fontFamily="Arial" transform={`rotate(90,${GX2+6},${GY1+GH/2})`}>Flanco derecho</text>
      {[{n:6,cx:(GX1+CX)/2,cy:(GY1+r1)/2},{n:1,cx:(CX+GX2)/2,cy:(GY1+r1)/2},
        {n:5,cx:(GX1+CX)/2,cy:(r1+r2)/2},{n:2,cx:(CX+GX2)/2,cy:(r1+r2)/2},
        {n:4,cx:(GX1+CX)/2,cy:(r2+GY2)/2},{n:3,cx:(CX+GX2)/2,cy:(r2+GY2)/2}
      ].map(p=><g key={p.n}><circle cx={p.cx} cy={p.cy} r={13} fill="#1e293b"/><text x={p.cx} y={p.cy+4} textAnchor="middle" fontSize="11" fontWeight="900" fill="white" fontFamily="Arial">{p.n}</text></g>)}
      {recursos.map(rr)}
      {recursos.length===0&&<text x={W/2} y={H/2+20} textAnchor="middle" fontSize="10" fill="#94a3b8" fontFamily="Arial" fontStyle="italic">Agrega recursos y arrástralos</text>}
    </svg>
    <div style={{marginTop:7,display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
      <select value={newR.tipo.label} onChange={e=>setNewR(p=>({...p,tipo:RECURSOS_TIPOS.find(t=>t.label===e.target.value)||RECURSOS_TIPOS[0]}))} style={{fontSize:12,padding:'7px 8px',border:'1.5px solid #e2e8f0',borderRadius:6,flex:'0 0 auto',maxWidth:160}}>
        {RECURSOS_TIPOS.map(t=><option key={t.label} value={t.label}>{t.shape==='pc'?'🟧':t.shape==='are'?'🟡':t.shape==='pap'?'🔷':t.icon} {t.label}</option>)}
      </select>
      <input value={newR.label} onChange={e=>setNewR(p=>({...p,label:e.target.value}))} placeholder="ID (ej: BF-4)…" style={{flex:1,minWidth:0,fontSize:12,padding:'7px 8px',border:'1.5px solid #e2e8f0',borderRadius:6}} onKeyDown={e=>e.key==='Enter'&&add()}/>
      <button onClick={add} style={{padding:'8px 12px',background:'#dc2626',color:'white',border:'none',borderRadius:6,cursor:'pointer',fontWeight:700,fontSize:13,flexShrink:0}}>+</button>
    </div>
    {recursos.length>0&&<div style={{marginTop:5,display:'flex',flexWrap:'wrap',gap:3}}>
      {recursos.map(r=><span key={r.id} className="rec-chip" style={{borderColor:r.color||'#ddd',color:r.color||'#333',background:(r.color||'#ddd')+'18'}}>
        {r.shape==='pc'?'🟧':r.shape==='are'?'🟡':r.shape==='pap'?'🔷':r.icon} {r.label}
      </span>)}
    </div>}
  </div>
}

function buildWA(op){
  const L=(i,k,v)=>v?i+' *'+k+':* '+v+'\n':'';
  return encodeURIComponent(
    '🧯 *RESUMEN OPERACIONAL EBF*\n━━━━━━━━━━━━━━━\n'+
    '🔥 *'+(op.nombre||'Incidente')+'*\n'+
    L('📋','N°',op.numero)+L('📅','Fecha',op.fecha)+L('⏰','Hora',op.hora)+
    '\n🔎 *EVALUACIÓN*\n'+
    L('🌲','Tipo',op.tipo_iiff?.join(', '))+L('📍','Lugar',op.lugar?.join(', '))+
    L('⚡','Motor',op.motor?.join(', '))+L('⚠️','Amenazas',op.amenazas?.join(', '))+
    L('🎯','Objetivos',op.objetivos)+
    '\n⚔️ *TÁCTICAS*\n'+
    (op.ataque_movil?'  ✅ Ataque móvil'+(op.puntos_ataque_movil?.length?' → '+op.puntos_ataque_movil.join(','):'')+'\n':'')+
    (op.linea_defensa?'  ✅ Línea defensa'+(op.puntos_linea_defensa?.length?' → '+op.puntos_linea_defensa.join(','):'')+'\n':'')+
    (op.patrullaje?'  ✅ Patrullaje\n':'')+
    '\n📊 *SITUACIÓN*\n'+
    L('🚦','Fase',op.fase+(op.contenido_pct?' '+op.contenido_pct+'%':''))+
    L('✅','Acción',op.accion?.join(', '))+L('⚙️','Mando SCI',op.forma_mando)+
    L('🏛','Instituciones',op.instituciones?.join(', '))+
    L('🟧','PC',op.pc_lugar)+L('🟡','Área Espera',op.are_lugar)+L('🔷','PAP',op.pap_lugar)+
    (op.bitacora?.length?'\n📓 *BITÁCORA*\n'+op.bitacora.map(e=>'  🕐 '+e.hora+' — '+e.texto).join('\n')+'\n':'')+
    L('💬','Obs',op.observaciones)+
    '\n🤝 *TRASPASO DE MANDO*\n'+
    L('📤','Entrega',op.mando_entrega)+L('📥','Recibe',op.mando_recibe)+
    '━━━━━━━━━━━━━━━\n_EBF Constitución · '+new Date().toLocaleString('es-CL')+'_'
  );
}
function buildCroquisSVG(recs){
  const W=500,H=400,ML=28,MR=28,MT=24,MB=24;
  const GX1=ML,GX2=W-MR,GY1=MT,GY2=H-MB,GW=GX2-GX1,GH=GY2-GY1,CX=GX1+GW/2;
  const r1=GY1+GH*.37,r2=GY1+GH*.65;
  const nums=[{n:6,cx:(GX1+CX)/2,cy:(GY1+r1)/2},{n:1,cx:(CX+GX2)/2,cy:(GY1+r1)/2},
    {n:5,cx:(GX1+CX)/2,cy:(r1+r2)/2},{n:2,cx:(CX+GX2)/2,cy:(r1+r2)/2},
    {n:4,cx:(GX1+CX)/2,cy:(r2+GY2)/2},{n:3,cx:(CX+GX2)/2,cy:(r2+GY2)/2}];
  const g=(x,y,s)=>`<g transform="translate(${x},${y})">${s}</g>`;
  const rSVG=(recs||[]).map(r=>{
    const lbl=(r.label||'').slice(0,12);
    if(r.shape==='pc')return g(r.x,r.y,`<rect x="-22" y="-13" width="44" height="26" rx="4" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="900" fill="#000" font-family="Arial">PC</text><text y="22" text-anchor="middle" font-size="7" fill="#333" font-family="Arial">${lbl}</text>`);
    if(r.shape==='are')return g(r.x,r.y,`<circle r="15" fill="#eab308" stroke="#a16207" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="900" fill="#000" font-family="Arial">E</text><text y="23" text-anchor="middle" font-size="7" fill="#333" font-family="Arial">${lbl}</text>`);
    if(r.shape==='pap')return g(r.x,r.y,`<polygon points="0,-15 15,0 0,15 -15,0" fill="#0ea5e9" stroke="#0369a1" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="central" font-size="6" font-weight="900" fill="#000" font-family="Arial">PAP</text><text y="23" text-anchor="middle" font-size="7" fill="#333" font-family="Arial">${lbl}</text>`);
    return g(r.x,r.y,`<circle r="15" fill="${r.color||'#374151'}" stroke="white" stroke-width="1.5" fill-opacity="0.92"/><text text-anchor="middle" dominant-baseline="central" font-size="11">${r.icon||'📍'}</text><rect x="-22" y="17" width="44" height="12" rx="2" fill="#111" fill-opacity="0.7"/><text y="25" text-anchor="middle" font-size="7" fill="white" font-family="Arial" font-weight="700">${lbl}</text>`);
  }).join('');
  const nSVG=nums.map(p=>`<g><circle cx="${p.cx}" cy="${p.cy}" r="12" fill="#1e293b"/><text x="${p.cx}" y="${p.cy+4}" text-anchor="middle" font-size="10" font-weight="900" fill="white" font-family="Arial">${p.n}</text></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:100%">
    <rect width="${W}" height="${H}" fill="white"/>
    <rect x="${GX1}" y="${GY1}" width="${GW}" height="${GH}" fill="white" stroke="#334155" stroke-width="2"/>
    <line x1="${CX}" y1="${GY1}" x2="${CX}" y2="${GY2}" stroke="#334155" stroke-width="1.5"/>
    <line x1="${GX1}" y1="${r1}" x2="${GX2}" y2="${r1}" stroke="#334155" stroke-width="1.5"/>
    <line x1="${GX1}" y1="${r2}" x2="${GX2}" y2="${r2}" stroke="#334155" stroke-width="1.5"/>
    <image href="${FIRE_IMG}" x="${GX1+GW*.1}" y="${GY1+GH*.02}" width="${GW*.8}" height="${GH*.95}" opacity="0.45" preserveAspectRatio="xMidYMid meet"/>
    <rect x="${GX1+GW*.28}" y="0" width="${GW*.44}" height="${MT}" fill="#cbd5e1"/>
    <text x="${CX}" y="${MT-4}" text-anchor="middle" font-size="9" font-weight="800" fill="#1e293b" font-family="Arial">Cabeza</text>
    <rect x="${GX1+GW*.28}" y="${GY2}" width="${GW*.44}" height="${MB}" fill="#cbd5e1"/>
    <text x="${CX}" y="${GY2+16}" text-anchor="middle" font-size="9" font-weight="800" fill="#1e293b" font-family="Arial">Cola</text>
    <rect x="0" y="${GY1}" width="${ML}" height="${GH}" fill="#dbeafe"/>
    <text x="${ML-6}" y="${GY1+GH/2}" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8" font-family="Arial" transform="rotate(-90,${ML-6},${GY1+GH/2})">Flanco izquierdo</text>
    <rect x="${GX2}" y="${GY1}" width="${MR}" height="${GH}" fill="#dbeafe"/>
    <text x="${GX2+6}" y="${GY1+GH/2}" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8" font-family="Arial" transform="rotate(90,${GX2+6},${GY1+GH/2})">Flanco derecho</text>
    ${nSVG}${rSVG}
  </svg>`;
}

function buildPDFHtml(op){

  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

4px}.footer{margin-top:8px;display:flex;justify-content:space-between;font-size:6.5pt;color:#94a3b8;border-top:2px solid #e2e8f0;padding-top:5px}</style></head><body>

  <div class="it" style="margin-bottom:5px"><b>H · Amenazas</b> ${arr(op.amenazas)} ${op.amenazas?.includes('Estructuras')?` · Def:${val(op.amenazas_cant_def)} No def:${val(op.amenazas_cant_nodef)}`:''}</div>

  ${op.ataque_movil?`<div class="it" style="margin-bottom:4px"><b>✅ Ataque móvil</b>${op.puntos_ataque_movil?.length?' → '+op.puntos_ataque_movil.join(', '):''}</div>`:''}

function imprimirPDF(op){
  // En móvil window.open puede ser bloqueado — usar iframe oculto
  const html = buildPDFHtml(op);
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
  if(isMobile){
    // Abrir en nueva pestaña con blob URL
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  } else {
    const w = window.open('','_blank');
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(()=>w.print(), 600);
  }
}

        <div className="modal-title">📧 Enviar por Email</div>
        <Fld label="Destinatario"><input value={emailDest} onChange={e=>setEmailDest(e.target.value)} placeholder="nombre@correo.cl" style={{width:'100%',padding:'9px 10px',border:'1.5px solid #e2e8f0',borderRadius:6,fontSize:'.88rem'}}/></Fld>
        <div style={{display:'flex',gap:8,marginTop:12}}><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setEmailModal(false)}>Cancelar</button><button className="btn" style={{flex:1,background:'#1d4ed8',color:'white'}} onClick={()=>{const sub=encodeURIComponent(`[EBF Constitución] Resumen Operacional — ${op.nombre||'Incidente'} ${op.fecha}`);const body=encodeURIComponent(`RESUMEN OPERACIONAL EBF CONSTITUCIÓN\n=====================================\nIncidente: ${op.nombre||'—'}  N°: ${op.numero||'—'}\nFecha: ${op.fecha}  Hora: ${op.hora}\n\nTIPO IIFF: ${(op.tipo_iiff||[]).join(', ')||'—'}\nLUGAR: ${(op.lugar||[]).join(', ')||'—'}\nMOTOR: ${(op.motor||[]).join(', ')||'—'}\nAMENAZAS: ${(op.amenazas||[]).join(', ')||'—'}\nOBJETIVOS: ${op.objetivos||'—'}\n\nFASE: ${op.fase||'—'}${op.contenido_pct?' '+op.contenido_pct+'%':''}\nACCIÓN: ${(op.accion||[]).join(', ')||'—'}\nMANDO SCI: ${op.forma_mando||'—'}\nPC: ${op.pc_lugar||'—'}\nÁREA ESPERA: ${op.are_lugar||'—'}\nPAP: ${op.pap_lugar||'—'}\n\nTRASPASO DE MANDO\nEntrega: ${op.mando_entrega||'—'}\nRecibe: ${op.mando_recibe||'—'}\n\nEBF Constitución — ${new Date().toLocaleString('es-CL')}`);window.location.href=`mailto:${emailDest}?subject=${sub}&body=${body}`;setEmailModal(false);}}>📧 Abrir correo</button></div>
      </div></div>}
    <div className="hdr">
      <button className="hdr-back" onClick={cerrar}>←</button>
      <div style={{flex:1,minWidth:0}}><div className="sub">OPERACIÓN ACTIVA</div><h1>{op.nombre||'Nueva operación'}</h1></div>
      <div className="hdr-actions">
        <button className="hdr-btn" onClick={save}>💾</button>
        <button className="hdr-btn" onClick={()=>imprimirPDF(op)}>🖨</button>
        <button className="hdr-btn" onClick={()=>setEmailModal(true)}>📧</button>
        <button className="hdr-btn wa" onClick={()=>window.open('https://wa.me/?text='+buildWA(op),'_blank')}>📱</button>
      </div>
    </div>
    <div className="steps">{PASOS.map((p,i)=><button key={i} className={'step'+(i===paso?' active':i<paso?' done':'')} onClick={()=>setPaso(i)}>{i<paso?'✓':p.icon} {p.label}</button>)}</div>
    <div className="scroll">{steps[paso]}</div>
    <div className="nav">
      <button className="btn btn-ghost btn-sm" onClick={()=>paso>0?setPaso(p=>p-1):cerrar()}>{paso>0?'◀ Anterior':'✕ Cerrar'}</button>
      {paso<PASOS.length-1?<button className="btn btn-fire btn-sm" onClick={()=>setPaso(p=>p+1)}>Siguiente ▶</button>:<button className="btn btn-green btn-sm" onClick={()=>{persist({...op,estado:'cerrada'});showToast('✅ Cerrada');cerrar();}}>✅ Finalizar</button>}
    </div>
  </div>
}
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body></html>
